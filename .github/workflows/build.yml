name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/CrossDeviceWirelessDebug-1.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossDeviceWirelessDebug-apk
          path: out/CrossDeviceWirelessDebug-1.0.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 跨设备无线调试 v1.0.${{ github.run_number }}
          files: out/CrossDeviceWirelessDebug-1.0.apk
          body: |
            跨设备无线调试 · 自动构建（debug 签名，可直接安装）

            同一局域网内，用另一台手机的无线调试配对并执行 ADB Shell 命令。
            最低 Android 5.0，目标机需 Android 11+。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
